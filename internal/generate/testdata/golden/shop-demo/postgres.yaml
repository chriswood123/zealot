# Generated by zealot generate from topology "shop-demo" — do not edit.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: postgres-data
    namespace: zealot-demo
    labels:
        app: postgres
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: postgres-initdb
    namespace: zealot-demo
    labels:
        app: postgres
data:
    init.sql: |
        CREATE TABLE IF NOT EXISTS items (
            id    integer PRIMARY KEY,
            name  text NOT NULL,
            price numeric(10,2) NOT NULL
        );
        INSERT INTO items
        SELECT g, 'item-' || g, (random() * 100)::numeric(10,2)
        FROM generate_series(1, 100000) AS g
        ON CONFLICT DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
    namespace: zealot-demo
    labels:
        app: postgres
spec:
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:16
                  env:
                    - name: POSTGRES_USER
                      value: zealot
                    - name: POSTGRES_PASSWORD
                      value: zealot
                    - name: POSTGRES_DB
                      value: shop
                    - name: PGDATA
                      value: /var/lib/postgresql/data/pgdata
                  ports:
                    - name: postgres
                      containerPort: 5432
                  readinessProbe:
                    exec:
                        command:
                            - pg_isready
                            - -U
                            - zealot
                            - -d
                            - shop
                  volumeMounts:
                    - name: data
                      mountPath: /var/lib/postgresql/data
                    - name: initdb
                      mountPath: /docker-entrypoint-initdb.d
                      readOnly: true
            volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: postgres-data
                - name: initdb
                  configMap:
                    name: postgres-initdb
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
    namespace: zealot-demo
    labels:
        app: postgres
spec:
    selector:
        app: postgres
    ports:
        - name: postgres
          port: 5432
          targetPort: postgres
