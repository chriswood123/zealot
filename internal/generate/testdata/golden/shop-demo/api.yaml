# Generated by zealot generate from topology "shop-demo" — do not edit.
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: api-config
    namespace: zealot-demo
    labels:
        app: api
data:
    node.yaml: |
        service: api
        listen: :8080
        datastores:
            postgres:
                driver: postgres
                dsn: postgres://zealot:zealot@postgres:5432/shop?sslmode=disable
            redis:
                driver: redis
                addr: redis:6379
        endpoints:
            - path: /
              pipeline:
                - query:
                    datastore: redis
                    op: GET
                    key: item:{rand:1000}
                - query:
                    datastore: postgres
                    sql: SELECT * FROM items WHERE id = {rand:1000} + 1
                - call:
                    targets:
                        - url: auth
                - respond:
                    status: 200
                    body: '{"service":"api"}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: api
    namespace: zealot-demo
    labels:
        app: api
spec:
    replicas: 3
    selector:
        matchLabels:
            app: api
    template:
        metadata:
            labels:
                app: api
        spec:
            containers:
                - name: zealot
                  image: zealot:latest
                  imagePullPolicy: IfNotPresent
                  args:
                    - serve
                    - --config
                    - /etc/zealot/node.yaml
                  ports:
                    - name: http
                      containerPort: 8080
                  readinessProbe:
                    httpGet:
                        path: /healthz
                        port: http
                  livenessProbe:
                    httpGet:
                        path: /healthz
                        port: http
                  volumeMounts:
                    - name: config
                      mountPath: /etc/zealot
                      readOnly: true
            volumes:
                - name: config
                  configMap:
                    name: api-config
---
apiVersion: v1
kind: Service
metadata:
    name: api
    namespace: zealot-demo
    labels:
        app: api
spec:
    selector:
        app: api
    ports:
        - name: http
          port: 80
          targetPort: http
