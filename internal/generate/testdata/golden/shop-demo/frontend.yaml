# Generated by zealot generate from topology "shop-demo" — do not edit.
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: frontend-config
    namespace: zealot-demo
    labels:
        app: frontend
data:
    node.yaml: |
        service: frontend
        listen: :8080
        endpoints:
            - path: /
              pipeline:
                - delay:
                    distribution: normal(20ms,5ms)
                - call:
                    targets:
                        - url: api
                        - url: cart
                    parallel: true
                - respond:
                    status: 200
                    body: '{"service":"frontend"}'
                    bodySize: 2kb
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    namespace: zealot-demo
    labels:
        app: frontend
spec:
    replicas: 2
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            containers:
                - name: zealot
                  image: zealot:latest
                  imagePullPolicy: IfNotPresent
                  args:
                    - serve
                    - --config
                    - /etc/zealot/node.yaml
                  ports:
                    - name: http
                      containerPort: 8080
                  resources:
                    requests:
                        cpu: 250m
                        memory: 128Mi
                    limits:
                        cpu: 250m
                        memory: 128Mi
                  readinessProbe:
                    httpGet:
                        path: /healthz
                        port: http
                  livenessProbe:
                    httpGet:
                        path: /healthz
                        port: http
                  volumeMounts:
                    - name: config
                      mountPath: /etc/zealot
                      readOnly: true
            volumes:
                - name: config
                  configMap:
                    name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
    name: frontend
    namespace: zealot-demo
    labels:
        app: frontend
spec:
    selector:
        app: frontend
    ports:
        - name: http
          port: 80
          targetPort: http
