# Local backing services for zealot datastore development and testing.
#
#   docker compose up -d
#   ./bin/zealot serve --config examples/node-datastores.yaml
#
# Postgres is seeded on first start by examples/db/init.sql (100k items).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zealot
      POSTGRES_PASSWORD: zealot
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - ./examples/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zealot -d shop"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
